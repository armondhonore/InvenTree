application:
  name: inventree
  pods:
    - name: web
      image: "registry.nexlayer.io/user_01kece1xyh817dwff7wnarhkxd/inventree:9f15757-fix8"
      path: /
      port: 8000
      servicePorts:
        - 8000
      env:
        - name: DATABASE_URL
          value: postgresql://inventree:password@${postgres:5432}/inventree
        - name: REDIS_URL
          value: redis://${redis:6379}
    - name: postgres
      image: mirror.gcr.io/library/postgres:16-alpine
      path: /postgres
      port: 5432
      servicePorts:
        - 5432
      env:
        - name: POSTGRES_USER
          value: inventree
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_DB
          value: inventree
    - name: redis
      image: mirror.gcr.io/library/redis:7-alpine
      path: /redis
      port: 6379
      servicePorts:
        - 6379